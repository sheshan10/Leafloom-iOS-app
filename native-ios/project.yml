# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Only needed if the hand-written LeafLoom.xcodeproj fails to open. On the Mac:
#   brew install xcodegen && cd native-ios && xcodegen generate
# This regenerates LeafLoom.xcodeproj with the same targets and settings.
name: LeafLoom
options:
  bundleIdPrefix: com.leafloom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LeafLoom:
    type: application
    platform: iOS
    sources:
      - path: LeafLoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leafloom.LeafLoom
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LeafLoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: "LeafLoom uses the camera so you can photograph a plant to identify it or add it to your collection. Photos stay on your device."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  LeafLoomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LeafLoomTests]
    dependencies:
      - target: LeafLoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.leafloom.LeafLoomTests
  LeafLoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LeafLoomUITests]
    dependencies:
      - target: LeafLoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.leafloom.LeafLoomUITests
        TEST_TARGET_NAME: LeafLoom
schemes:
  LeafLoom:
    build:
      targets:
        LeafLoom: all
    test:
      targets:
        - LeafLoomTests
        - LeafLoomUITests
