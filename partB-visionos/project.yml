# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Only needed if the hand-written LeafLoomSpatial.xcodeproj fails to open. On the Mac:
#   brew install xcodegen && cd partB-visionos && xcodegen generate
name: LeafLoomSpatial
options:
  bundleIdPrefix: com.leafloom
  deploymentTarget:
    visionOS: "2.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LeafLoomSpatial:
    type: application
    platform: visionOS
    sources:
      - path: LeafLoomSpatial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leafloom.LeafLoomSpatial
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "LeafLoom Spatial"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
  LeafLoomSpatialTests:
    type: bundle.unit-test
    platform: visionOS
    sources: [LeafLoomSpatialTests]
    dependencies:
      - target: LeafLoomSpatial
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.leafloom.LeafLoomSpatialTests
schemes:
  LeafLoomSpatial:
    build:
      targets:
        LeafLoomSpatial: all
    test:
      targets:
        - LeafLoomSpatialTests
